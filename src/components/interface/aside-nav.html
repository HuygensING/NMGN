<!-- Nagivation -->
    <aside id="asideNavPanel" class="fixed inset-0 z-50 [@media(min-width:768px)_and_(orientation:landscape)]:right-0 [@media(min-width:768px)_and_(orientation:landscape)]:top-0 [@media(min-width:768px)_and_(orientation:landscape)]:bottom-0 [@media(min-width:768px)_and_(orientation:landscape)]:w-1/2 [@media(min-width:768px)_and_(orientation:landscape)]:left-auto xl:static xl:inset-auto xl:w-auto xl:min-w-[260px] pt-12 bg-nmgnBlue-50 pl-10 {{gridClass}}">
        
        <nav class="text-sm flex flex-col gap-2 w-full *:no-underline *:text-nmgnBlue-800 sticky top-[calc(var(--page-header-height,3.25rem)+1.5rem)] max-h-[calc(100vh-var(--page-header-height,3.25rem)-2rem)] overflow-y-auto pb-16 pr-2" aria-label="Inhoud van deze pagina">
            <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:z-[100] focus:bg-white focus:text-nmgnBlue-900 focus:px-3 focus:py-2 focus:outline focus:outline-2 focus:outline-nmgnBlue-600">Ga naar de inhoud</a>
            <div class="mb-4"><a href="index.html" aria-label="Naar de homepage">&#8592; Home</a></div>   
            <div class="flex justify-between mb-4 border-b border-nmgnBlue-200 pb-2">
                <em>Inhoud</em>
                <a href="#page-top" class="no-underline pl-2 inline-block pr-2" aria-label="Naar boven van de pagina">&#8593; top</a>
            </div>
            <div class="flex flex-col gap-2 justify-between mb-4 pb-2" id="contentNavigationSource">
            {{#each content}}
                {{#if (ifSame type "h2") }}
                    <a href="#{{id}}" class="contentNavigationItem" id="a{{id}}">{{{htmlRaw}}}</a>
                {{/if}}
                {{#if (ifSame type "h3") }}
                    <a href="#{{id}}" class="contentNavigationItem ml-1" id="a{{id}}">{{{htmlRaw}}}</a>
                {{/if}}
                {{#if (ifSame type "h4") }}
                    <a href="#{{id}}" class="contentNavigationItem ml-2" id="a{{id}}">{{{htmlRaw}}}</a>
                {{/if}}
                {{#if (ifSame type "h5") }}
                    <a href="#{{id}}" class="contentNavigationItem ml-3" id="a{{id}}">{{{htmlRaw}}}</a>
                {{/if}}
            {{/each}}
                <a href="#noten" class="" id="a{{id}}">Noten</a>
            </div>
            
            


        </nav>
    </aside>
