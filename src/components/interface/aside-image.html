<!-- image -->
<aside class="relative z-0 {{gridClass}}">


    
    <div class="w-full min-h-screen sticky top-0 flex flex-col justify-center items-center px-6 bg-nmgnBlue-50 z-0 overflow-y-auto max-h-screen">

         <figure class="flex flex-col min-h-0 w-full mb-4">
            <img id="asideImg" src="images/d{{chapterMetadata.part}}h{{chapterMetadata.chapter}}/d{{chapterMetadata.part}}h{{chapterMetadata.chapter}}-600/{{firstImage.htmlRaw}}" class="w-full shrink-0 object-center" alt="{{firstImage.imagedata.description}}" loading="lazy">
            <div class="flex justify-between items-center gap-4 -mt-1 shrink-0">
                <div id="asideImageLockControl" class="group flex items-center gap-2 shrink-0" aria-checked="false">
                    <button type="button" id="asideImageLockToggle" role="switch" aria-checked="false" aria-label="Klik om beeld vast te zetten" class="flex items-center justify-center p-2 rounded-full border-2 border-nmgnBlue-800 bg-nmgnBlue-800 text-white cursor-pointer shrink-0 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-nmgnBlue-800">
                        <span class="flex items-center group-aria-checked:hidden">{{>icons/iconPin pinned=false twSize="4"}}</span>
                        <span class="hidden items-center group-aria-checked:flex">{{>icons/iconPin pinned=true twSize="4"}}</span>
                    </button>
                    <button type="button" id="asideImageLockToggleText" tabindex="-1" aria-hidden="true" class="text-sm text-nmgnBlue-800 cursor-pointer bg-transparent border-0 p-0 text-left">
                        <span class="group-aria-checked:hidden">Klik om beeld vast te zetten</span>
                        <span class="hidden group-aria-checked:inline">Klik om mee te scrollen</span>
                    </button>
                </div>
                <button type="button" onclick="bigImageViewer();return false;" class="bg-nmgnBlue-800 p-2 rounded-full text-white text-sm cursor-pointer shrink-0">Vergroten</button>
            </div>
            <figcaption class="text-sm max-w-xl min-h-0 flex flex-col text-left">
                <strong class="mt-4 block shrink-0" id="asideImgTitle">{{firstImage.imagedata.title}}</strong>
                <span id="asideCaption" class="overflow-y-auto max-h-[30vh] min-h-0 mt-1" tabindex="0">
                    {{firstImage.imagedata.description}}
                    {{#if firstImage.imagedata.description2}}<br>{{firstImage.imagedata.description2}}{{/if}}
                    {{#if firstImage.imagedata.description3}}<br>{{firstImage.imagedata.description3}}{{/if}}
                    {{#if firstImage.imagedata.location}}<br>{{firstImage.imagedata.location}}{{/if}}
                    {{#if firstImage.imagedata.owner}}<br>{{firstImage.imagedata.owner}}{{/if}}
                </span>
                
            </figcaption>
        </figure> 
        

    </div>
</aside>
